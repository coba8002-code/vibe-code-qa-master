name: QA MASTER self-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Security baseline (Python dependencies)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Save QA report
        if: always()
        run: |
          mkdir -p qa-artifacts
          printf '%s\n' '# QA MASTER Self-check' '' 'Application security, performance, resources and hard tests remain NOT RUN until a target application and isolated TEST environment exist.' > qa-artifacts/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-master-baseline-report
          path: qa-artifacts/report.md
          retention-days: 14
