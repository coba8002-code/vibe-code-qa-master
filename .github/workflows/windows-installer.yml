name: Build Windows installer (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure application source was uploaded
        shell: pwsh
        run: |
          foreach ($p in @('app/main.py','windows/VibeQAMaster.spec','windows/smoke-windows.ps1','windows/verify-installer.ps1','windows/installer.iss','requirements.txt')) {
            if (!(Test-Path $p)) { throw "Missing source file: $p. Import v9 package first." }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Unit and security-policy tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean windows/VibeQAMaster.spec
      - name: Windows packaged executable smoke test
        shell: pwsh
        run: ./windows/smoke-windows.ps1
      - name: Build per-user installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing on runner' }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer by silent install and startup
        shell: pwsh
        run: ./windows/verify-installer.ps1
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: VibeCodeQAMaster-Windows-Setup-unsigned
          path: |
            release/VibeCodeQAMaster-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
